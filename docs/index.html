<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Dailybloom">
<meta name="theme-color" content="#7B68C2">
<title>Dailybloom</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#F8F6FC;--surface:#fff;--text:#1F1D27;--muted:#5C5770;--line:#E4DFEE;--field:#F0EDF6;--danger:#BA3D4F;
--accent:#7B68C2;--soft:#EAE4F8;--onsoft:#2D2352;--radius:20px}
body.dark{--bg:#141319;--surface:#1D1B25;--text:#E8E5EE;--muted:#BDB7CC;--line:#353145;--field:#2A2734;--danger:#FF8A98}
body[data-accent=mint]{--accent:#3E8E74;--soft:#DDF2EA;--onsoft:#17392F}
body[data-accent=peach]{--accent:#C0684D;--soft:#FBE3DA;--onsoft:#5A2A1A}
body.dark[data-accent=lavender]{--accent:#C6B9F2;--soft:#3D3462;--onsoft:#EAE4F8}
body.dark[data-accent=mint]{--accent:#9ED6BE;--soft:#244A3E;--onsoft:#DDF2EA}
body.dark[data-accent=peach]{--accent:#F0BBA8;--soft:#5A3D35;--onsoft:#FBE3DA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:16px}
main{padding:0 0 calc(92px + env(safe-area-inset-bottom));min-height:100%}
.view{display:none;padding:16px 22px}
.view.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:8px 0 14px}
h1{font-size:28px;margin:0;font-weight:700}
h2{font-size:18px;margin:0}
.muted,.hint,small{color:var(--muted)}
.hint{font-size:13px;margin:10px 2px}
.label{font-size:13px;color:var(--muted);font-weight:600;margin:18px 2px 8px;letter-spacing:.02em}
.row{display:flex;gap:8px;align-items:center}
.scroll{overflow-x:auto;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--soft);color:var(--onsoft);border-color:transparent}
.chip.soft{background:var(--soft);color:var(--onsoft);border:none;cursor:default}
.field{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:var(--radius);padding:14px 16px;font:inherit;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{min-height:280px;resize:vertical;line-height:1.5;margin-top:12px}
.tools{margin-top:12px}
.tools button{border:none;background:var(--field);color:var(--text);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;white-space:nowrap;cursor:pointer}
.photos{gap:10px;padding-bottom:4px}
.thumb{position:relative;flex:0 0 108px;height:108px;border-radius:16px;overflow:hidden;background:var(--field);cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(0,0,0,.55);color:#fff;font-size:16px;line-height:26px;padding:0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;margin-top:12px;padding:12px 18px;border-radius:999px;font:inherit;font-weight:600;cursor:pointer;border:none}
.btn.soft{background:var(--soft);color:var(--onsoft)}
.btn.disabled{opacity:.45;pointer-events:none}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.month-nav button{border:none;background:var(--surface);color:var(--text);width:40px;height:40px;border-radius:50%;font-size:22px;cursor:pointer;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weekdays{font-size:12px;color:var(--muted);text-align:center;margin-bottom:4px}
.day{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font:inherit;font-size:15px;border:1px solid transparent;background:var(--surface);color:var(--text);cursor:pointer;padding:0}
.day.written{background:var(--soft);color:var(--onsoft)}
.day.missed{color:var(--danger);border-color:var(--line)}
.day.faded{opacity:.35;cursor:default}
.day.today{border:2px solid var(--accent)}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day.empty{visibility:hidden}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;margin-top:14px}
.card h3{margin:0 0 6px;font-size:18px}
.card .body p{margin:6px 0;line-height:1.5}
.card .body h3{font-size:20px;margin:10px 0 4px}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.switch-row+.switch-row{border-top:1px solid var(--line)}
.switch-row span{display:flex;flex-direction:column}
input[type=checkbox]{width:46px;height:28px;appearance:none;-webkit-appearance:none;background:var(--line);border-radius:999px;position:relative;flex:0 0 auto;outline:none;transition:background .2s;margin:0}
input[type=checkbox]::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}
input[type=checkbox]:checked{background:var(--accent)}
input[type=checkbox]:checked::after{transform:translateX(18px)}
.seg{display:flex;background:var(--field);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);border-radius:999px;padding:9px 6px;font:inherit;font-size:14px;cursor:pointer}
.seg button.on{background:var(--surface);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.swatch{width:44px;height:44px;border-radius:50%;border:none;cursor:pointer;padding:0}
.swatch.on{outline:3px solid var(--text);outline-offset:2px}
.row-btn{display:block;width:100%;text-align:left;border:none;background:none;color:var(--accent);font:inherit;font-size:16px;padding:12px 0;cursor:pointer}
.row-btn.danger{color:var(--danger)}
.row-btn+.row-btn{border-top:1px solid var(--line)}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabs button{flex:1;border:none;background:none;color:var(--muted);font:inherit;font-size:13px;padding:10px 0;border-radius:16px;cursor:pointer}
.tabs button.on{color:var(--onsoft);background:var(--soft);font-weight:600}
.viewer{position:fixed;inset:0;background:#000;z-index:10;display:flex;align-items:center;justify-content:center}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;touch-action:pinch-zoom}
.viewer button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.2);color:#fff;font-size:24px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body class="light" data-accent="lavender">
<main>
  <section id="journal" class="view active">
    <header class="top">
      <div><h1>Journal</h1><p id="today-label" class="muted" style="margin:4px 0 0"></p></div>
      <span id="streak" class="chip soft" hidden></span>
    </header>
    <p class="label">How are you feeling?</p>
    <div id="moods" class="row scroll"></div>
    <div style="margin-top:14px"><input id="title" class="field" placeholder="Title (optional)" maxlength="200"></div>
    <div id="toolbar" class="row scroll tools">
      <button data-act="bold"><b>Bold</b></button>
      <button data-act="italic"><i>Italic</i></button>
      <button data-act="underline"><u>Underline</u></button>
      <button data-act="heading">Heading</button>
      <button data-act="bullet">Bullet</button>
      <button data-act="check">Checklist</button>
    </div>
    <textarea id="body" class="field" placeholder="Write about your day"></textarea>
    <p class="label">Photos <span id="photo-count"></span></p>
    <div id="photos" class="row scroll photos"></div>
    <label id="add-photo" class="btn soft">Add photos<input id="file" type="file" accept="image/*" multiple hidden></label>
    <p id="save-hint" class="hint">Saved on this device as you type.</p>
  </section>

  <section id="calendar" class="view">
    <header class="top"><h1>Calendar</h1></header>
    <div class="month-nav"><button id="prev" aria-label="Previous month">‹</button><h2 id="month-title"></h2><button id="next" aria-label="Next month">›</button></div>
    <div id="weekdays" class="grid weekdays"></div>
    <div id="days" class="grid"></div>
    <p id="cal-summary" class="hint"></p>
    <article id="day-detail" class="card"></article>
  </section>

  <section id="settings" class="view">
    <header class="top"><h1>Settings</h1></header>
    <div class="card">
      <p class="label" style="margin-top:0">Theme</p>
      <div class="seg" id="theme-seg">
        <button data-theme="system">System</button><button data-theme="light">Light</button><button data-theme="dark">Dark</button>
      </div>
      <p class="label">Accent colour</p>
      <div class="row" id="accents">
        <button class="swatch" data-accent="lavender" style="background:#7B68C2" aria-label="Lavender"></button>
        <button class="swatch" data-accent="mint" style="background:#3E8E74" aria-label="Mint"></button>
        <button class="swatch" data-accent="peach" style="background:#C0684D" aria-label="Peach"></button>
      </div>
    </div>
    <div class="card">
      <label class="switch-row"><span>Show writing prompts<small>A new prompt each day in an empty entry</small></span><input type="checkbox" id="prompts"></label>
      <label class="switch-row"><span>Week starts on Monday<small>Changes the calendar layout</small></span><input type="checkbox" id="monday"></label>
    </div>
    <div class="card">
      <button class="row-btn" id="export">Export journal as text</button>
      <button class="row-btn danger" id="delete">Delete all entries</button>
    </div>
    <div class="card">
      <h3>Dailybloom 1.1</h3>
      <p class="muted" style="margin:0 0 10px">Made by aym</p>
      <p class="muted" style="margin:0 0 10px">Write one entry a day, add up to 10 photos, and check the calendar to see which days you wrote and which you missed. Your entries stay on this device.</p>
      <p class="muted" id="install-tip" style="margin:0"></p>
    </div>
  </section>
</main>

<nav class="tabs">
  <button data-tab="journal" class="on">Journal</button>
  <button data-tab="calendar">Calendar</button>
  <button data-tab="settings">Settings</button>
</nav>

<div id="viewer" class="viewer" hidden>
  <button id="viewer-close" aria-label="Close">×</button>
  <img id="viewer-img" alt="">
</div>
<div id="toast" class="toast"></div>

<script>
(() => {
'use strict';

const KEY_E = 'dailybloom.entries', KEY_S = 'dailybloom.settings', KEY_F = 'dailybloom.firstDay';
const MAX_PHOTOS = 10;
const MOODS = ['Great', 'Good', 'Okay', 'Low', 'Rough'];
const PROMPTS = [
  'What made you smile today?',
  'What is one thing you are looking forward to?',
  'What did you learn today?',
  'Who did you spend time with today?',
  'What is one small win from today?',
  'What was hard today, and how did you handle it?',
  'What is something you want to remember about today?'
];
const $ = (s) => document.querySelector(s);

// ---------- storage ----------
function load(key, fallback) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; } catch (e) { return fallback; }
}
function save(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { toast('Storage is full or blocked'); }
}
let settings = Object.assign({ theme: 'system', accent: 'lavender', showPrompts: true, weekMonday: false }, load(KEY_S, {}));
let entries = load(KEY_E, {});
let firstDay = localStorage.getItem(KEY_F) || dayKey();
try { localStorage.setItem(KEY_F, firstDay); } catch (e) {}

const dbPromise = new Promise((resolve, reject) => {
  const req = indexedDB.open('dailybloom', 1);
  req.onupgradeneeded = () => req.result.createObjectStore('photos');
  req.onsuccess = () => resolve(req.result);
  req.onerror = () => reject(req.error);
});
async function photoTx(mode, fn) {
  const db = await dbPromise;
  return new Promise((resolve, reject) => {
    const tx = db.transaction('photos', mode);
    const req = fn(tx.objectStore('photos'));
    tx.oncomplete = () => resolve(req && req.result);
    tx.onerror = () => reject(tx.error);
  });
}
const putPhoto = (id, blob) => photoTx('readwrite', (s) => s.put(blob, id));
const delPhoto = (id) => photoTx('readwrite', (s) => s.delete(id));
const clearPhotos = () => photoTx('readwrite', (s) => s.clear());
const getPhotoBlob = (id) => photoTx('readonly', (s) => s.get(id));
const urlCache = new Map();
async function photoUrl(id) {
  if (!urlCache.has(id)) {
    const blob = await getPhotoBlob(id);
    if (!blob) return null;
    urlCache.set(id, URL.createObjectURL(blob));
  }
  return urlCache.get(id);
}

// ---------- dates and entries ----------
function dayKey(d = new Date()) {
  const z = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${z(d.getMonth() + 1)}-${z(d.getDate())}`;
}
function parseKey(k) { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); }
function longDate(d) { return d.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' }); }
function isBlank(e) { return !e.title.trim() && !e.body.trim() && !e.mood && e.photos.length === 0; }
function persist() { save(KEY_E, entries); }

function updateToday(change) {
  const k = dayKey();
  const current = entries[k] || { title: '', body: '', mood: null, photos: [] };
  const next = change(Object.assign({}, current, { photos: current.photos.slice() }));
  if (isBlank(next)) delete entries[k]; else entries[k] = next;
  persist();
  renderStreak();
}

function streak() {
  const d = new Date();
  if (!entries[dayKey(d)]) d.setDate(d.getDate() - 1);
  let n = 0;
  while (entries[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function renderStreak() {
  const n = streak();
  const el = $('#streak');
  el.hidden = n === 0;
  el.textContent = `${n} day streak`;
}

function dayStatus(k, todayK) {
  if (k < firstDay) return 'before';
  if (k > todayK) return 'future';
  const written = entries[k] && !isBlank(entries[k]);
  if (written) return 'written';
  return k === todayK ? 'pending' : 'missed';
}

// ---------- formatting ----------
function esc(s) { return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function renderMarkup(text) {
  return text.split('\n').map((line) => {
    const head = /^# /.test(line);
    let h = esc(head ? line.slice(2) : line)
      .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
      .replace(/__(.+?)__/g, '<u>$1</u>')
      .replace(/(?<!\*)\*(?=[^\s*])(.+?)(?<=[^\s*])\*(?!\*)/g, '<i>$1</i>');
    return head ? `<h3>${h}</h3>` : `<p>${h || '&nbsp;'}</p>`;
  }).join('');
}
function plainText(text) {
  return text
    .replace(/^# /gm, '')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/__(.+?)__/g, '$1')
    .replace(/(?<!\*)\*(?=[^\s*])(.+?)(?<=[^\s*])\*(?!\*)/g, '$1');
}

// ---------- toast ----------
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1600);
}

// ---------- journal ----------
const body = $('#body');
const title = $('#title');
let saveTimer;
function flashSaved() {
  $('#save-hint').textContent = 'Saved on this device.';
}

function renderMoods() {
  const today = entries[dayKey()];
  $('#moods').innerHTML = '';
  MOODS.forEach((m) => {
    const b = document.createElement('button');
    b.className = 'chip' + (today && today.mood === m ? ' on' : '');
    b.textContent = m;
    b.onclick = () => {
      updateToday((e) => { e.mood = e.mood === m ? null : m; return e; });
      renderMoods();
      flashSaved();
    };
    $('#moods').appendChild(b);
  });
}

function renderPhotos() {
  const e = entries[dayKey()];
  const list = e ? e.photos : [];
  $('#photo-count').textContent = `(${list.length} of ${MAX_PHOTOS})`;
  const wrap = $('#photos');
  wrap.innerHTML = '';
  list.forEach((id) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    const img = document.createElement('img');
    img.alt = 'Photo';
    photoUrl(id).then((u) => { if (u) img.src = u; });
    img.onclick = () => openViewer(id);
    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '×';
    x.setAttribute('aria-label', 'Remove photo');
    x.onclick = (ev) => { ev.stopPropagation(); removePhoto(id); };
    div.append(img, x);
    wrap.appendChild(div);
  });
  const add = $('#add-photo');
  const full = list.length >= MAX_PHOTOS;
  add.classList.toggle('disabled', full);
  add.firstChild.textContent = full ? 'Photo limit reached' : 'Add photos';
}

async function removePhoto(id) {
  updateToday((e) => { e.photos = e.photos.filter((p) => p !== id); return e; });
  URL.revokeObjectURL(urlCache.get(id));
  urlCache.delete(id);
  await delPhoto(id).catch(() => {});
  renderPhotos();
  flashSaved();
}

function loadImage(file) {
  return new Promise((resolve, reject) => {
    const u = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(u); resolve(img); };
    img.onerror = () => { URL.revokeObjectURL(u); reject(new Error('not an image')); };
    img.src = u;
  });
}
async function compress(file) {
  const img = await loadImage(file);
  const scale = Math.min(1, 2048 / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * scale);
  c.height = Math.round(img.naturalHeight * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise((resolve) => c.toBlob(resolve, 'image/jpeg', 0.9));
}

$('#file').addEventListener('change', async (ev) => {
  const files = Array.from(ev.target.files || []);
  ev.target.value = '';
  const current = entries[dayKey()];
  const room = MAX_PHOTOS - (current ? current.photos.length : 0);
  if (room <= 0) return toast('Photo limit reached');
  const picked = files.slice(0, room);
  if (files.length > room) toast(`Only ${room} more photo${room === 1 ? '' : 's'} fit`);
  for (const file of picked) {
    try {
      const id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random())) + '.jpg';
      const blob = await compress(file);
      await putPhoto(id, blob);
      updateToday((e) => { e.photos.push(id); return e; });
    } catch (err) {
      toast('Could not add one photo');
    }
  }
  renderPhotos();
  renderMoods();
  flashSaved();
});

body.addEventListener('input', () => onBodyInput());
title.addEventListener('input', () => onBodyInput());
function onBodyInput() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    updateToday((e) => { e.title = title.value; e.body = body.value; return e; });
    flashSaved();
    const words = body.value.trim() ? body.value.trim().split(/\s+/).length : 0;
    $('#save-hint').textContent = `${words} ${words === 1 ? 'word' : 'words'} · Saved on this device.`;
  }, 300);
}

function wrapSelection(marker) {
  const s = body.selectionStart, e = body.selectionEnd, v = body.value;
  body.value = v.slice(0, s) + marker + v.slice(s, e) + marker + v.slice(e);
  body.selectionStart = s + marker.length;
  body.selectionEnd = e === s ? s + marker.length : e + marker.length;
  body.focus();
  onBodyInput();
}
function linePrefix(prefix) {
  const s = body.selectionStart, v = body.value;
  const atLineStart = s === 0 || v[s - 1] === '\n';
  const insert = atLineStart ? prefix : '\n' + prefix;
  body.value = v.slice(0, s) + insert + v.slice(s);
  body.selectionStart = body.selectionEnd = s + insert.length;
  body.focus();
  onBodyInput();
}
document.querySelectorAll('#toolbar button').forEach((b) => {
  b.addEventListener('click', () => {
    const act = b.dataset.act;
    if (act === 'bold') wrapSelection('**');
    else if (act === 'italic') wrapSelection('*');
    else if (act === 'underline') wrapSelection('__');
    else if (act === 'heading') linePrefix('# ');
    else if (act === 'bullet') linePrefix('- ');
    else if (act === 'check') linePrefix('[ ] ');
  });
});

function renderJournal() {
  const k = dayKey();
  const d = new Date();
  $('#today-label').textContent = longDate(d);
  const e = entries[k] || { title: '', body: '' };
  title.value = e.title;
  body.value = e.body;
  body.placeholder = settings.showPrompts ? PROMPTS[d.getDay() % PROMPTS.length] + '' : 'Write about your day';
  renderMoods();
  renderPhotos();
  renderStreak();
}

// ---------- viewer ----------
function openViewer(id) {
  photoUrl(id).then((u) => {
    if (!u) return;
    $('#viewer-img').src = u;
    $('#viewer').hidden = false;
  });
}
$('#viewer-close').onclick = () => { $('#viewer').hidden = true; };
$('#viewer').addEventListener('click', (ev) => { if (ev.target.id === 'viewer') $('#viewer').hidden = true; });

// ---------- calendar ----------
let viewMonth = new Date();
viewMonth.setDate(1);
let selected = dayKey();

function renderCalendar() {
  const todayK = dayKey();
  const names = settings.weekMonday ? ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'] : ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  $('#weekdays').innerHTML = names.map((n) => `<div>${n}</div>`).join('');
  $('#month-title').textContent = viewMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

  const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
  const first = new Date(year, month, 1);
  const offset = settings.weekMonday ? (first.getDay() + 6) % 7 : first.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  const grid = $('#days');
  grid.innerHTML = '';
  let written = 0, missed = 0;
  for (let i = 0; i < offset; i++) {
    const b = document.createElement('div');
    b.className = 'day empty';
    grid.appendChild(b);
  }
  for (let day = 1; day <= daysInMonth; day++) {
    const k = dayKey(new Date(year, month, day));
    const status = dayStatus(k, todayK);
    if (status === 'written') written++;
    if (status === 'missed') missed++;
    const b = document.createElement('button');
    let cls = 'day';
    if (status === 'written') cls += ' written';
    if (status === 'missed') cls += ' missed';
    if (status === 'before' || status === 'future') cls += ' faded';
    if (k === todayK) cls += ' today';
    if (k === selected) cls += ' sel';
    b.className = cls;
    b.textContent = day;
    b.onclick = () => { selected = k; renderCalendar(); };
    grid.appendChild(b);
  }
  $('#cal-summary').textContent = `${written} written · ${missed} missed`;
  renderDayDetail();
}

async function renderDayDetail() {
  const box = $('#day-detail');
  const e = entries[selected];
  const d = parseKey(selected);
  const status = dayStatus(selected, dayKey());
  if (!e || isBlank(e)) {
    const msg = status === 'before' ? 'Before you started using Dailybloom.'
      : status === 'future' ? 'Not yet.'
      : status === 'pending' ? 'Nothing written yet today.'
      : 'Nothing was written on this day.';
    box.innerHTML = `<h3>${longDate(d)}</h3><p class="muted" style="margin:0">${msg}</p>`;
    return;
  }
  box.innerHTML = '';
  const h = document.createElement('h3');
  h.textContent = longDate(d);
  box.appendChild(h);
  if (e.mood) {
    const m = document.createElement('p');
    m.className = 'muted';
    m.style.margin = '0 0 6px';
    m.textContent = 'Mood: ' + e.mood;
    box.appendChild(m);
  }
  if (e.title) {
    const t = document.createElement('p');
    t.style.fontWeight = '600';
    t.textContent = e.title;
    box.appendChild(t);
  }
  if (e.body) {
    const b = document.createElement('div');
    b.className = 'body';
    b.innerHTML = renderMarkup(e.body);
    box.appendChild(b);
  }
  if (e.photos.length) {
    const row = document.createElement('div');
    row.className = 'row scroll photos';
    row.style.marginTop = '10px';
    e.photos.forEach((id) => {
      const div = document.createElement('div');
      div.className = 'thumb';
      const img = document.createElement('img');
      photoUrl(id).then((u) => { if (u) img.src = u; });
      img.onclick = () => openViewer(id);
      div.appendChild(img);
      row.appendChild(div);
    });
    box.appendChild(row);
  }
}

$('#prev').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() - 1); renderCalendar(); };
$('#next').onclick = () => { viewMonth.setMonth(viewMonth.getMonth() + 1); renderCalendar(); };

// ---------- settings ----------
function applyTheme() {
  const dark = settings.theme === 'dark' || (settings.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.body.className = dark ? 'dark' : 'light';
  document.body.dataset.accent = settings.accent;
  document.querySelector('meta[name=theme-color]').content = dark ? '#141319' : '#7B68C2';
}
function renderSettings() {
  document.querySelectorAll('#theme-seg button').forEach((b) => b.classList.toggle('on', b.dataset.theme === settings.theme));
  document.querySelectorAll('#accents .swatch').forEach((b) => b.classList.toggle('on', b.dataset.accent === settings.accent));
  $('#prompts').checked = settings.showPrompts;
  $('#monday').checked = settings.weekMonday;
}
function setSetting(patch) {
  settings = Object.assign({}, settings, patch);
  save(KEY_S, settings);
  applyTheme();
  renderSettings();
}
document.querySelectorAll('#theme-seg button').forEach((b) => b.onclick = () => setSetting({ theme: b.dataset.theme }));
document.querySelectorAll('#accents .swatch').forEach((b) => b.onclick = () => setSetting({ accent: b.dataset.accent }));
$('#prompts').onchange = (ev) => { setSetting({ showPrompts: ev.target.checked }); renderJournal(); };
$('#monday').onchange = (ev) => setSetting({ weekMonday: ev.target.checked });

function exportText() {
  const out = ['Dailybloom journal', `Exported on ${longDate(new Date())}`, ''];
  Object.keys(entries).sort().forEach((k) => {
    const e = entries[k];
    out.push('='.repeat(48));
    out.push(longDate(parseKey(k)) + ' ' + parseKey(k).getFullYear());
    if (e.mood) out.push('Mood: ' + e.mood);
    if (e.title.trim()) { out.push(''); out.push(e.title.trim()); }
    if (e.body.trim()) { out.push(''); out.push(plainText(e.body).trim()); }
    if (e.photos.length) { out.push(''); out.push(`[${e.photos.length} photo(s) not included in text export]`); }
    out.push('');
  });
  return out.join('\n');
}
$('#export').onclick = async () => {
  const file = new File([exportText()], 'Dailybloom-journal.txt', { type: 'text/plain' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: 'Dailybloom journal' }); } catch (e) {}
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
};
$('#delete').onclick = async () => {
  if (!window.confirm('Delete every journal entry and photo on this device? This cannot be undone.')) return;
  entries = {};
  persist();
  urlCache.forEach((u) => URL.revokeObjectURL(u));
  urlCache.clear();
  await clearPhotos().catch(() => {});
  renderJournal();
  renderCalendar();
  toast('All entries deleted');
};

const isStandalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
$('#install-tip').textContent = isStandalone ? ''
  : isIOS ? 'To install: tap the Share button in Safari, then Add to Home Screen.'
  : 'To install: use your browser menu and choose Install app or Add to Home Screen.';

// ---------- tabs ----------
function showTab(name) {
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('active', v.id === name));
  document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'journal') renderJournal();
  if (name === 'calendar') { selected = dayKey(); renderCalendar(); }
  window.scrollTo(0, 0);
}
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => showTab(b.dataset.tab));

// Re-check the day when the app comes back to the front (e.g. after midnight).
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) { applyTheme(); renderJournal(); }
});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

applyTheme();
renderSettings();
renderJournal();
})();
</script>
</body>
</html>
